version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel_pass
      POSTGRES_DB: novel_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel_engine"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
