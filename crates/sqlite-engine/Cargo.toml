[package]
name = "sqlite-engine"
description = "手机单机版引擎：在进程内提供与电脑端完全一致的 HTTP API，数据落在 SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
domain = { workspace = true }
ai = { workspace = true }
application = { workspace = true }
runtime = { workspace = true }
infrastructure = { workspace = true }
agent = { workspace = true }
sqlite-db = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "derive"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
db = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
tokio = { workspace = true }
